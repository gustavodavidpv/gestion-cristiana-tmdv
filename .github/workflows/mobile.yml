# CI de la app móvil (PLAN_APP_MOVIL.md T4.1): análisis estático + pruebas en
# cada PR o push que toque mobile/ o los permisos del servidor.
name: Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'server/config/permissions.js'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'server/config/permissions.js'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
