# CI de la app móvil (PLAN_APP_MOVIL.md T4.1): análisis estático + pruebas en
# cada PR o push que toque mobile/ o los permisos del servidor.
name: Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'server/config/permissions.js'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'server/config/permissions.js'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - run: flutter pub get
      # Roboto (material_fonts): las pruebas la cargan para medir textos como en
      # un teléfono real. La caché del CI puede dejar la carpeta marcada como
      # al día pero sin los .ttf, así que se fuerza la descarga.
      - run: |
          flutter precache --universal --force
          ls "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts" || true
          test -f "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/roboto-regular.ttf"
      - run: flutter analyze
      - run: flutter test
